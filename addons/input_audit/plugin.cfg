[plugin]

name="Input Audit Lite"
description="Input action audit for Godot 4, tested on 4.4, 4.5, 4.6 and 4.7. Reads the project's own input map - the actions project.godot declares, as the editor currently has them - and the action names in its .gd, .tscn and .tres files - C# is not read, and folders carrying a .gdignore, folders that are links, and names starting with a . are skipped - then reports action names that do not exist, actions nothing binds, actions no controller can press, the same stored binding on two actions, and gamepad-axis deadzones below 0.01 or above 0.9."
author="Idle Hands"
version="0.1.0-lite"
script="plugin.gd"
